# Voice foreman: two virtual audio devices for the phone line, created every time pipewire-pulse starts.
# vf_rx: the call's incoming audio (baresip plays into it; foremand listens on vf_rx.monitor)
# vf_tx: Omarchy's voice and music (foremand plays into it; baresip records vf_tx.monitor)
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=vf_rx rate=48000 channels=1 sink_properties=device.description=Voice-Foreman-call-in" flags = [ "nofail" ] }
    { cmd = "load-module" args = "module-null-sink sink_name=vf_tx rate=48000 channels=1 sink_properties=device.description=Voice-Foreman-call-out" flags = [ "nofail" ] }
]
